# Example container MiniDLNA config. Copy to minidlna.local.conf (gitignored)
# and bind-mount it from docker-compose.override.yaml if you need a
# private serial, NIC list, or extra exclude_dir lines.

user=minidlna

media_dir=V,/storage/video

# Skip extra directories (path-component match under media_dir).
# Repeat the option to exclude more locations.
# @eaDir / #recycle / .part / .!qB and similar are skipped automatically.
# Sample / trailer files and sample/ trailer/ folders are skipped automatically.
#exclude_dir=video/incomplete
#exclude_file=*-extra.*

root_container=V

port=8200

db_dir=/var/cache/minidlna
log_dir=/var/log/minidlna

# Leave unset to advertise on every usable interface, or set your LAN NIC.
#network_interface=eth0

notify_interval=900

album_art_names=Cover.jpg/cover.jpg/AlbumArtSmall.jpg/albumartsmall.jpg
album_art_names=AlbumArt.jpg/albumart.jpg/Album.jpg/album.jpg
album_art_names=Folder.jpg/folder.jpg/Thumb.jpg/thumb.jpg
album_art_names=poster.jpg/Poster.jpg/poster.png/Poster.png

# This image is built with --enable-thumbnail. Off until you want a
# first-enable pass that decodes a frame from every video without art.
#enable_thumbnail=no
#thumbnail_width=160
#thumbnail_quality=8
#enable_thumbnail_filmstrip=no
